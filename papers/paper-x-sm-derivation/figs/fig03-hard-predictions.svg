<text x="68" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">benchmark-dependent</text>
<rect x="470" y="130" width="360" height="210" rx="16" ry="16" fill="#f7f4ee" stroke="#b45f06" stroke-width="2.2"/>
<text x="488" y="158" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#b45f06" font-weight="bold" text-anchor="start">m_Phi2</text>
<text x="488" y="190" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">1.0e-22 eV</text>
<text x="488" y="208" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">candidate prediction</text>
<text x="488" y="226" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">anchor-dependent</text>
<text x="488" y="244" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#222" font-weight="normal" text-anchor="start">normalization</text>
<rect x="890" y="130" width="360" height="210" rx="16" ry="16" fill="#f7f4ee" stroke="#8a3b12" stroke-width="2.2"/>
